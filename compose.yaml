name: dendroflow-lab

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dendroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-dendroflow} -d postgres"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dendroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # The image's default command is `dendroflow migrate`.
    restart: "no"

  prepare_snapshots:
    image: alpine:3.20
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown ${DENDROFLOW_CLI_UID:?Set DENDROFLOW_CLI_UID in .env}:${DENDROFLOW_CLI_GID:?Set DENDROFLOW_CLI_GID in .env} \"${DENDROFLOW_SNAPSHOT_CONTAINER_PATH:?Set DENDROFLOW_SNAPSHOT_CONTAINER_PATH in .env}\""]
    volumes:
      - dendroflow_snapshots:${DENDROFLOW_SNAPSHOT_CONTAINER_PATH:?Set DENDROFLOW_SNAPSHOT_CONTAINER_PATH in .env}
    restart: "no"

  cli:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    entrypoint: ["dendroflow"]
    working_dir: /work
    user: "${DENDROFLOW_CLI_UID:?Set DENDROFLOW_CLI_UID in .env}:${DENDROFLOW_CLI_GID:?Set DENDROFLOW_CLI_GID in .env}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      prepare_snapshots:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dendroflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DENDROFLOW_ENVIRONMENT: ${DENDROFLOW_ENVIRONMENT:-local}
      DENDROFLOW_SNAPSHOT_DIR: ${DENDROFLOW_SNAPSHOT_CONTAINER_PATH:?Set DENDROFLOW_SNAPSHOT_CONTAINER_PATH in .env}
      DENDROFLOW_FILE_SETTLE_SECONDS: ${DENDROFLOW_FILE_SETTLE_SECONDS:-1}
    volumes:
      - ./:/work
      - type: volume
        source: dendroflow_snapshots
        target: ${DENDROFLOW_SNAPSHOT_CONTAINER_PATH:?Set DENDROFLOW_SNAPSHOT_CONTAINER_PATH in .env}
      # Register source paths using the container path configured below.
      - type: bind
        source: ${DENDROFLOW_NAS_HOST_PATH:?Set DENDROFLOW_NAS_HOST_PATH in .env}
        target: ${DENDROFLOW_NAS_CONTAINER_PATH:?Set DENDROFLOW_NAS_CONTAINER_PATH in .env}
        read_only: true
        bind:
          create_host_path: false

volumes:
  postgres_data:
  dendroflow_snapshots:
    name: ${DENDROFLOW_SNAPSHOT_VOLUME_NAME:?Set DENDROFLOW_SNAPSHOT_VOLUME_NAME in .env}
